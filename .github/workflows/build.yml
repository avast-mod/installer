name: Build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/avast-installer.exe dist/AVaSt-Installer-Windows.exe
      - uses: actions/upload-artifact@v7
        with:
          name: installer-windows
          path: dist/*

  macos:
    name: macOS
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target aarch64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
      - name: Bundle
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          APP="dist/AVaSt Installer.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/avast-installer" \
            target/aarch64-apple-darwin/release/avast-installer \
            target/x86_64-apple-darwin/release/avast-installer
          sed "s/@VERSION@/$VERSION/g" macos/Info.plist > "$APP/Contents/Info.plist"

          ICONSET=$(mktemp -d)/AppIcon.iconset
          mkdir -p "$ICONSET"
          for size in 16 32 128 256; do
            sips -z $size $size assets/icon.png --out "$ICONSET/icon_${size}x${size}.png" > /dev/null
            sips -z $((size * 2)) $((size * 2)) assets/icon.png --out "$ICONSET/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"

          # Ad-hoc signature. Apple Silicon refuses to run unsigned code at all.
          codesign --force --deep --sign - "$APP"

          ln -s /Applications dist/Applications
          hdiutil create -volname "AVaSt Installer" -srcfolder dist -ov -format UDZO AVaSt-Installer-macOS.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: installer-macos
          path: AVaSt-Installer-macOS.dmg

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: installer-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
